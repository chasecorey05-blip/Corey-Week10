<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <title> Start Stop Fun</title>
    </head>
    <body>
        <button id = "Start1">Start1</button>
        <button id = "Stop1">Stop1</button>

         <script>


const ctx = new AudioContext();

let osc1, VibMod, ModGainMod;

document.querySelector("#Start1").onclick = () =>

{



osc1 = new OscillatorNode(ctx);
osc1.frequency.value = 88;
osc1.type = "triangle";

const osc1Gain = new GainNode(ctx);
osc1Gain.gain.value = 1;

osc1.connect(osc1Gain);
osc1Gain.connect(ctx.destination);

VibMod = new OscillatorNode(ctx);
VibMod.type = "sine";
VibMod.frequency.value = 200;

ModGainMod = new OscillatorNode(ctx);
ModGainMod.type = "sawtooth";
ModGainMod.frequency.value = 0.25;

const ModGainModGain = new GainNode(ctx);
ModGainModGain.gain.value = 400;


const VibModGain = new GainNode(ctx);
VibModGain.gain.value = 400; // right now, the oscillator will "wobble" by 100 Hz


VibMod.connect(VibModGain);
VibModGain.connect(osc1.frequency); // try switching to oscillator.detune

ModGainMod.connect(ModGainModGain);
ModGainModGain.connect(VibModGain.gain);


osc1.start();
VibMod.start();
ModGainMod.start();

}

document.querySelector("#Stop1").onclick = () =>

{

osc1.stop();
VibMod.stop();
ModGainMod.stop();

}


</script>

</body>

</html>
